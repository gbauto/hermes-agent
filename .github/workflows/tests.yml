name: Tests
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PROFILE: gbauto-hermes-agent
      LANGUAGE_HINT: python
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |-
        set -euo pipefail
        RG_VERSION=15.1.0
        RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
        curl -sSfL -o "$RG_TARBALL" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
        echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
        tar -xzf "$RG_TARBALL"
        sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
        rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
        rg --version
        python -m pip install uv
        uv venv .venv --python 3.11
        source .venv/bin/activate
        uv pip install -e ".[all,dev]"
    - name: Run test command
      run: |-
        source .venv/bin/activate
        env OPENROUTER_API_KEY= OPENAI_API_KEY= NOUS_API_KEY= python scripts/run_tests_parallel.py
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PROFILE: gbauto-hermes-agent
      LANGUAGE_HINT: python
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |-
        set -euo pipefail
        RG_VERSION=15.1.0
        RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
        curl -sSfL -o "$RG_TARBALL" \
          "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
        echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
        tar -xzf "$RG_TARBALL"
        sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
        rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
        rg --version
        python -m pip install uv
        uv venv .venv --python 3.11
        source .venv/bin/activate
        uv pip install -e ".[all,dev]"
    - name: Run test command
      run: |-
        source .venv/bin/activate
        env OPENROUTER_API_KEY= OPENAI_API_KEY= NOUS_API_KEY= python -m pytest tests/e2e/ -v --tb=short
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - docs/**
  pull_request:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - docs/**
