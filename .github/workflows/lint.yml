name: Lint (ruff + ty)
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-diff:
    name: ruff + ty diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
    - name: Install ruff + ty
      run: 'uv tool install ruff

        uv tool install ty

        '
    - name: Determine base ref
      id: base
      run: "# For PRs, diff against the merge base with the target branch.\n# For pushes to main, diff against the previous\
        \ commit on main.\nif [ \"${{ github.event_name }}\" = \"pull_request\" ]; then\n  BASE_SHA=$(git merge-base \"origin/${{\
        \ github.base_ref }}\" HEAD)\n  BASE_REF=\"origin/${{ github.base_ref }}\"\nelse\n  BASE_SHA=$(git rev-parse HEAD~1\
        \ 2>/dev/null || git rev-parse HEAD)\n  BASE_REF=\"HEAD~1\"\nfi\necho \"sha=${BASE_SHA}\" >> \"$GITHUB_OUTPUT\"\n\
        echo \"ref=${BASE_REF}\" >> \"$GITHUB_OUTPUT\"\necho \"Base SHA: ${BASE_SHA}\"\necho \"Base ref: ${BASE_REF}\"\n"
    - name: Run ruff + ty on HEAD
      run: "mkdir -p .lint-reports/head\nruff check --output-format json --exit-zero \\\n  > .lint-reports/head/ruff.json\
        \ || true\nty check --output-format gitlab --exit-zero \\\n  > .lint-reports/head/ty.json || true\necho \"HEAD ruff:\
        \ $(wc -c < .lint-reports/head/ruff.json) bytes\"\necho \"HEAD ty:   $(wc -c < .lint-reports/head/ty.json) bytes\"\
        \n"
    - name: Run ruff + ty on base (via git worktree)
      run: "mkdir -p .lint-reports/base\n# Use a worktree so we don't clobber the main checkout. If the basex\n# SHA is identical\
        \ to HEAD (e.g. first commit), skip and leave the\n# base reports empty \u2014 the diff script handles missing files.\n\
        HEAD_SHA=$(git rev-parse HEAD)\nBASE_SHA=\"${{ steps.base.outputs.sha }}\"\nif [ \"$BASE_SHA\" = \"$HEAD_SHA\" ];\
        \ then\n  echo \"Base SHA == HEAD SHA, skipping base scan.\"\n  echo '[]' > .lint-reports/base/ruff.json\n  echo '[]'\
        \ > .lint-reports/base/ty.json\nelse\n  git worktree add --detach /tmp/lint-base \"$BASE_SHA\"\n  (\n    cd /tmp/lint-base\n\
        \    ruff check --output-format json --exit-zero \\\n      > \"$GITHUB_WORKSPACE/.lint-reports/base/ruff.json\" ||\
        \ true\n    ty check --output-format gitlab --exit-zero \\\n      > \"$GITHUB_WORKSPACE/.lint-reports/base/ty.json\"\
        \ || true\n  )\n  git worktree remove --force /tmp/lint-base\nfi\necho \"base ruff: $(wc -c < .lint-reports/base/ruff.json)\
        \ bytes\"\necho \"base ty:   $(wc -c < .lint-reports/base/ty.json) bytes\"\n"
    - name: Generate diff summary
      env:
        BASE_REF: ${{ steps.base.outputs.ref }}
        HEAD_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      run: "python scripts/lint_diff.py \\\n  --base-ruff .lint-reports/base/ruff.json \\\n  --head-ruff .lint-reports/head/ruff.json\
        \ \\\n  --base-ty   .lint-reports/base/ty.json \\\n  --head-ty   .lint-reports/head/ty.json \\\n  --base-ref  \"$BASE_REF\"\
        \ \\\n  --head-ref  \"$HEAD_REF\" \\\n  --output    .lint-reports/summary.md\ncat .lint-reports/summary.md >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: Upload reports as artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: lint-reports
        path: .lint-reports/
        retention-days: 14
    - name: Post / update PR comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: "const fs = require('fs');\nconst body = fs.readFileSync('.lint-reports/summary.md', 'utf8');\nconst marker\
          \ = '<!-- lint-diff-summary -->';\nconst fullBody = marker + '\\n' + body;\n\nconst { data: comments } = await github.rest.issues.listComments({\n\
          \  owner: context.repo.owner,\n  repo:  context.repo.repo,\n  issue_number: context.issue.number,\n});\nconst existing\
          \ = comments.find(c => c.body && c.body.includes(marker));\nif (existing) {\n  await github.rest.issues.updateComment({\n\
          \    owner: context.repo.owner,\n    repo:  context.repo.repo,\n    comment_id: existing.id,\n    body: fullBody,\n\
          \  });\n} else {\n  await github.rest.issues.createComment({\n    owner: context.repo.owner,\n    repo:  context.repo.repo,\n\
          \    issue_number: context.issue.number,\n    body: fullBody,\n  });\n}\n"
  ruff-blocking:
    name: ruff enforcement (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PROFILE: gbauto-hermes-agent
      LANGUAGE_HINT: python
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: python -m pip install uv && uv tool install ruff
    - name: Run lint command
      run: |
        ruff check .
  windows-footguns:
    name: Windows footguns (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PROFILE: gbauto-hermes-agent
      LANGUAGE_HINT: python
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run test command
      run: python scripts/check-windows-footguns.py --all
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - docs/**
    - website/**
  pull_request:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - docs/**
    - website/**
